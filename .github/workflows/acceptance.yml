name: acceptance

# Build ProtoOS (kernel, programs, archives and disk images), check on main and tags that
# the kernel ELF, the program archive and the disk image are byte-identical to the released ones, run the
# host tests and the full acceptance matrix (T1-T29, N1-N18, 3 clean boots
# each) under QEMU on a stock Ubuntu 24.04 runner (QEMU 8.2.2, OpenSBI from
# the distribution archive, gdb 15); exact versions are printed by the
# install step.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, OpenSBI, GDB, binutils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-misc opensbi gdb-multiarch \
            binutils-riscv64-unknown-elf python3-venv
          qemu-system-riscv64 --version | head -n 1
          dpkg-query -W qemu-system-misc opensbi gdb-multiarch

      - name: Install pinned Zig 0.13.0
        run: sh build-scripts/setup-zig.sh

      - name: Build
        run: sh build-scripts/build-wsl.sh

      # release/ holds the files of the last release: they must match on main and
      # on tags; a development branch builds the next version, so it only prints its hashes.
      - name: ELF, program archive and disk image are byte-identical to release/
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          cat release/SHA256SUMS
          cd build && sha256sum -c ../release/SHA256SUMS

      - name: Hashes of this build (development branch, not yet released)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: cat build/SHA256SUMS

      - name: Host tests
        run: sh build-scripts/host-tests.sh

      - name: Acceptance T1-T29, N1-N18 x3
        run: python3 validation/run_acceptance.py --reps 3 --t7-seconds 30 --out "$RUNNER_TEMP/acceptance"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: warn
